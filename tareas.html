<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>PROYECTO SISTEMA - Tareas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* =========================
       ESTÉTICA BASE (INDEX)
       ========================= */
    :root{
      --bg:#0e1a17;
      --panel:#11211e;
      --card:#11211e;
      --text:#e6edf7;
      --muted:#a9b7d1;
      --line:rgba(255,255,255,.08);
      --accent:#22c55e;
      --danger:#ef4444;
      --shadow:0 12px 30px rgba(0,0,0,.35);
      --radius:14px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,Segoe UI,Roboto,Arial;
      background:
        radial-gradient(1200px 600px at 20% 0%, rgba(34,197,94,.14), transparent 55%),
        radial-gradient(900px 500px at 100% 10%, rgba(34,197,94,.08), transparent 60%),
        var(--bg);
      color:var(--text);
    }

    .app{
      display:grid;
      grid-template-columns:270px 1fr;
      min-height:100vh;
    }

    .sidebar{
      border-right:1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.03), transparent 50%);
      padding:18px 14px;
      position:sticky;
      top:0;
      height:100vh;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 10px 18px;
    }
    .logo{
      width:36px; height:36px;
      border-radius:10px;
      background: linear-gradient(135deg, rgba(34,197,94,.9), rgba(16,185,129,.7));
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
    }
    .brand h1{
      font-size:14px;
      margin:0;
      line-height:1.2;
      letter-spacing:.2px;
    }
    .brand span{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-top:2px;
    }

    .nav{
      display:flex;
      flex-direction:column;
      gap:8px;
      padding:0 6px;
    }
    .nav a{
      text-decoration:none;
      color:var(--text);
      padding:10px 10px;
      border-radius:var(--radius);
      display:flex;
      align-items:center;
      gap:10px;
      border:1px solid transparent;
      background: transparent;
    }
    .nav a:hover{
      border-color: var(--line);
      background: rgba(255,255,255,.03);
    }
    .nav a.active{
      background: rgba(34,197,94,.12);
      border-color: rgba(34,197,94,.25);
    }
    .nav .dot{
      width:8px;height:8px;border-radius:999px;
      background: rgba(255,255,255,.22);
    }
    .nav a.active .dot{ background: var(--accent); }

    .footer{
      position:absolute;
      bottom:14px;
      left:14px;
      right:14px;
      padding:12px;
      border:1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,.03);
      color:var(--muted);
      font-size:12px;
    }

    /* ===== MAIN ===== */
    .main{padding:18px}

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:14px 16px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:rgba(255,255,255,.03);
      box-shadow:var(--shadow);
    }
    .topbar h2{margin:0;font-size:18px}
    .topbar p{margin:0;font-size:12px;color:var(--muted)}

    .grid{margin-top:14px}

    .card{
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:var(--card);
      padding:18px;
      box-shadow:var(--shadow);
    }

    /* ===== CONTENIDO TAREAS (MISMA LÓGICA) ===== */
    .panel{
      margin-top:14px;
      padding:14px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:rgba(255,255,255,.03);
    }

    .filtros{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
      font-size:12px;
    }
    .filtros input,
    .filtros select{
      padding:8px 10px;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.25);
      color:var(--text);
    }

    .tabla-wrapper{
      margin-top:14px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      overflow:auto;
    }

    table{
      width:100%;
      border-collapse:collapse;
      font-size:12px;
    }
    thead{
      background:rgba(34,197,94,.15);
      position:sticky;
      top:0;
    }
    th,td{
      padding:7px;
      border-bottom:1px solid rgba(255,255,255,.08);
      white-space:nowrap;
    }
    tr:hover td{background:rgba(34,197,94,.08)}

    .estado-pill{
      padding:3px 8px;
      border-radius:999px;
      font-size:10px;
      font-weight:bold;
    }
    .estado-pendiente{
      background:rgba(239,68,68,.25);
      border:1px solid rgba(239,68,68,.4);
    }
    .estado-hecha{
      background:rgba(34,197,94,.25);
      border:1px solid rgba(34,197,94,.4);
    }

    .link-caso a{
      color:#86efac;
      text-decoration:none;
      font-size:11px;
    }

    .sin-registros{
      padding:20px;
      text-align:center;
      color:var(--muted);
    }

    .resumen{
      margin-top:10px;
      font-size:12px;
      color:var(--muted);
    }

    @media(max-width:980px){
      .app{grid-template-columns:1fr}
      .sidebar{height:auto}
      .footer-card{position:relative;margin-top:14px}
    }
  </style>
</head>

<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <h1>PROYECTO SISTEMA</h1>
        <span>Liquidador de siniestros</span>
      </div>
    </div>

    <nav class="nav">
      <a href="index.html"><span class="dot"></span>Inicio</a>
      <a href="lista.html"><span class="dot"></span>Listado de Casos</a>
      <a class="active" href="tareas.html"><span class="dot"></span>Tareas</a>
      <a href="reportes.html"><span class="dot"></span>Reportes</a>
      <a href="facturacion.html"><span class="dot"></span>Facturación</a>
      <a href="administracion.html"><span class="dot"></span>Administración</a>
    </nav>

      <div class="footer">
        <div id="infoUsuario"></div>
      </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div>
        <h2>Tareas pendientes</h2>
        <p>Tareas cargadas desde los casos</p>
      </div>
    </div>

    <div class="grid">
      <section class="card">

        <!-- filtros -->
        <section class="panel">
          <div class="filtros">
            <input type="text" id="buscador" placeholder="Buscar..." />
            <select id="filtroEstado">
              <option value="pendientes">Solo pendientes</option>
              <option value="todas">Todas</option>
              <option value="hechas">Solo hechas</option>
            </select>
            <label id="lblSoloMias">
              <input type="checkbox" id="soloMias" checked /> Solo mis casos
            </label>
            <button id="btnReset">Limpiar</button>
          </div>
        </section>

        <!-- tabla -->
        <section class="tabla-wrapper">
          <table id="tablaTareas">
            <thead>
              <tr>
                <th data-col="numeroSiniestro">Siniestro</th>
                <th data-col="asegurado">Asegurado</th>
                <th data-col="analista">Analista</th>
                <th data-col="texto">Tarea</th>
                <th data-col="fecha">Fecha</th>
                <th data-col="estado">Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <div id="sinRegistros" class="sin-registros" style="display:none;"></div>
        </section>

        <div class="resumen" id="resumenTareas"></div>

      </section>
    </div>
  </main>
</div>
  <script src="datos.js"></script>

<script>
  // === CONSTANTES DE STORAGE (mismas que en detalle.html) ===
  const LS_CASOS_EXTRA_KEY = "casos_extra_v1";
  const LS_TAREAS_KEY = "tareas_siniestros_v1";

  // === UTILIDADES FECHAS ===
  function formatearFecha(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    const dia = String(d.getDate()).padStart(2, "0");
    const mes = String(d.getMonth() + 1).padStart(2, "0");
    const anio = d.getFullYear();
    return dia + "/" + mes + "/" + anio;
  }

  // Hora desde ISO (para fecha de creación)
  function formatearHoraDesdeIso(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    return hh + ":" + mm;
  }

  // === CARGA DATOS BASE ===
  function obtenerCasosExtra() {
    try {
      const raw = localStorage.getItem(LS_CASOS_EXTRA_KEY);
      if (!raw) return [];
      return JSON.parse(raw);
    } catch (e) {
      return [];
    }
  }

  function obtenerTareasPorCaso() {
    try {
      const raw = localStorage.getItem(LS_TAREAS_KEY);
      if (!raw) return {};
      return JSON.parse(raw);
    } catch (e) {
      return {};
    }
  }

  function obtenerUsuarioActual() {
    try {
      const raw = localStorage.getItem("currentUser");
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  }

  // Casos base desde datos.js (variable global "casos")
  const casosBase = Array.isArray(window.casos) ? window.casos : [];
  const casosExtra = obtenerCasosExtra();
  const todosLosCasos = [...casosBase, ...casosExtra];

  // Mapa por número de siniestro
  const mapaCasos = {};
  todosLosCasos.forEach(c => {
    const key = String(c.nSiniestro || "").trim();
    if (key) {
      mapaCasos[key] = c;
    }
  });

  // Usuario actual
  const currentUser = obtenerUsuarioActual();
  const nombreUsuario =
    (currentUser && (currentUser.nombre || currentUser.user || currentUser.username || currentUser.email)) ||
    "(sin usuario)";

  const infoUsuarioEl = document.getElementById("infoUsuario");
  infoUsuarioEl.textContent = `Usuario: ${nombreUsuario}${currentUser?.rol ? " | Rol: " + currentUser.rol : ""}`;

  // Si no hay currentUser, oculto checkbox "solo mis casos"
  const chkSoloMias = document.getElementById("soloMias");
  const lblSoloMias = document.getElementById("lblSoloMias");
  if (!currentUser) {
    lblSoloMias.style.display = "none";
  }

  // === FLATTEN TAREAS (de tareas_siniestros_v1) ===
  const tareasPorCaso = obtenerTareasPorCaso();

  // Cada elemento: { numeroSiniestro, asegurado, analista, texto, fecha, hora, creadaEn, creadaPor, hecha, keyCaso, indexEnCaso }
  const todasLasTareas = [];

  Object.keys(tareasPorCaso).forEach(keyCaso => {
    const lista = tareasPorCaso[keyCaso] || [];
    const caso = mapaCasos[String(keyCaso)] || null;

    const numeroSiniestro = String(keyCaso);
    const asegurado = caso ? (caso.asegurado || "") : "";
    const analista = caso ? (caso.analista || "") : "";

    lista.forEach((tarea, idx) => {
      todasLasTareas.push({
        keyCaso,
        indexEnCaso: idx,
        numeroSiniestro,
        asegurado,
        analista,
        texto: tarea.texto || "",
        fecha: tarea.fecha || null,           // fecha asignada
        hora: tarea.hora || null,             // hora asignada
        creadaEn: tarea.creadaEn || null,     // fecha/hora creación
        creadaPor: tarea.creadaPor || null,   // opcional (si la empezás a guardar desde detalle)
        hecha: !!tarea.hecha
      });
    });
  });

  // === ESTADO DE LA VISTA ===
  let tareasFiltradas = [...todasLasTareas];

  const tbody = document.querySelector("#tablaTareas tbody");
  const sinRegistrosEl = document.getElementById("sinRegistros");
  const resumenEl = document.getElementById("resumenTareas");

  const inputBuscador = document.getElementById("buscador");
  const selectEstado = document.getElementById("filtroEstado");

  document.getElementById("btnReset").addEventListener("click", () => {
    inputBuscador.value = "";
    selectEstado.value = "pendientes";
    if (currentUser) chkSoloMias.checked = true;
    aplicarFiltros();
  });

  function aplicarFiltros() {
    const texto = inputBuscador.value.trim().toLowerCase();
    const modoEstado = selectEstado.value; // pendientes / todas / hechas
    const soloMias = currentUser ? chkSoloMias.checked : false;
    const nombreRef =
      currentUser && (currentUser.nombre || currentUser.user || currentUser.username || "").toLowerCase();

    tareasFiltradas = todasLasTareas.filter(t => {
      // Filtro texto
      const matchTexto =
        !texto ||
        (t.numeroSiniestro && t.numeroSiniestro.toLowerCase().includes(texto)) ||
        (t.asegurado && t.asegurado.toLowerCase().includes(texto)) ||
        (t.texto && t.texto.toLowerCase().includes(texto)) ||
        (t.analista && t.analista.toLowerCase().includes(texto));

      if (!matchTexto) return false;

      // Filtro estado
      let matchEstado = true;
      if (modoEstado === "pendientes") {
        matchEstado = !t.hecha;
      } else if (modoEstado === "hechas") {
        matchEstado = t.hecha;
      }

      if (!matchEstado) return false;

      // Filtro "solo mis casos"
      if (soloMias && nombreRef) {
        const analistaLower = (t.analista || "").toLowerCase();
        if (analistaLower !== nombreRef) return false;
      }

      return true;
    });

    renderTabla();
  }

  inputBuscador.addEventListener("input", aplicarFiltros);
  selectEstado.addEventListener("change", aplicarFiltros);
  chkSoloMias.addEventListener("change", aplicarFiltros);

  // === ORDENAMIENTO ===
  let ordenActual = {
    columna: null,
    direccion: 1 // 1 asc, -1 desc
  };

  function ordenarPor(col) {
    if (ordenActual.columna === col) {
      ordenActual.direccion = -ordenActual.direccion;
    } else {
      ordenActual.columna = col;
      ordenActual.direccion = 1;
    }

    tareasFiltradas.sort((a, b) => {
      let va = a[col];
      let vb = b[col];

      // Fecha (usa la fecha asignada)
      if (col === "fecha") {
        const da = a.fecha ? new Date(a.fecha) : new Date(0);
        const db = b.fecha ? new Date(b.fecha) : new Date(0);
        return (da - db) * ordenActual.direccion;
      }

      // Estado (pendiente primero)
      if (col === "estado") {
        const ea = a.hecha ? 1 : 0;
        const eb = b.hecha ? 1 : 0;
        return (ea - eb) * ordenActual.direccion;
      }

      if (va == null) va = "";
      if (vb == null) vb = "";
      if (typeof va === "string") va = va.toLowerCase();
      if (typeof vb === "string") vb = vb.toLowerCase();

      if (va < vb) return -1 * ordenActual.direccion;
      if (va > vb) return 1 * ordenActual.direccion;
      return 0;
    });

    renderTabla();
  }

  document.querySelectorAll("#tablaTareas thead th").forEach(th => {
    const col = th.getAttribute("data-col");
    if (!col || col === "acciones") return;
    th.addEventListener("click", () => ordenarPor(col));
  });

  // === RENDER TABLA ===
  function renderTabla() {
    tbody.innerHTML = "";

    if (!todasLasTareas.length) {
      sinRegistrosEl.style.display = "block";
      sinRegistrosEl.textContent = "No se encontraron tareas en el sistema (tareas_siniestros_v1).";
      resumenEl.textContent = `Casos cargados: ${todosLosCasos.length}.`;
      return;
    }

    if (!tareasFiltradas.length) {
      sinRegistrosEl.style.display = "block";
      sinRegistrosEl.textContent = "No se encontraron tareas con los filtros seleccionados.";
      resumenEl.textContent = `Total de tareas: ${todasLasTareas.length}.`;
      return;
    }

    sinRegistrosEl.style.display = "none";

    tareasFiltradas.forEach(t => {
      const tr = document.createElement("tr");

      const tdSin = document.createElement("td");
      tdSin.textContent = t.numeroSiniestro;

      const tdAseg = document.createElement("td");
      tdAseg.textContent = t.asegurado || "";

      const tdAnalista = document.createElement("td");
      tdAnalista.textContent = t.analista || "";

      const tdTexto = document.createElement("td");
      tdTexto.textContent = t.texto || "";

      const tdFecha = document.createElement("td");
      const fechaAsignadaTexto = t.fecha ? formatearFecha(t.fecha) : "-";
      const horaAsignadaTexto = t.hora || "";
      const fechaCreacionTexto = t.creadaEn ? formatearFecha(t.creadaEn) : "";
      const horaCreacionTexto = t.creadaEn ? formatearHoraDesdeIso(t.creadaEn) : "";
      const creadorTexto = t.creadaPor || t.analista || "";

      let htmlFecha = "";

      if (fechaAsignadaTexto !== "-" || horaAsignadaTexto) {
        htmlFecha += `<div><strong>Asignada:</strong> ${fechaAsignadaTexto}${horaAsignadaTexto ? " " + horaAsignadaTexto : ""}</div>`;
      }
      if (fechaCreacionTexto || horaCreacionTexto) {
        htmlFecha += `<div><small>Creada: ${fechaCreacionTexto} ${horaCreacionTexto}${creadorTexto ? " - por " + creadorTexto : ""}</small></div>`;
      }

      tdFecha.innerHTML = htmlFecha;

      const tdEstado = document.createElement("td");
      const spanEstado = document.createElement("span");
      spanEstado.className = "estado-pill " + (t.hecha ? "estado-hecha" : "estado-pendiente");
      spanEstado.textContent = t.hecha ? "HECHA" : "PENDIENTE";
      tdEstado.appendChild(spanEstado);

      const tdAcciones = document.createElement("td");
      tdAcciones.className = "link-caso";

      // Checkbox para marcar hecha/no hecha
      const chk = document.createElement("input");
      chk.type = "checkbox";
      chk.checked = t.hecha;
      chk.style.marginRight = "6px";
      chk.title = "Marcar como hecha / pendiente";

      chk.addEventListener("change", () => {
        // Actualizar en memoria
        t.hecha = chk.checked;

        // Actualizar en estructura original y guardar
        const lista = tareasPorCaso[t.keyCaso] || [];
        if (lista[t.indexEnCaso]) {
          lista[t.indexEnCaso].hecha = t.hecha;
          localStorage.setItem(LS_TAREAS_KEY, JSON.stringify(tareasPorCaso));
        }

        // Reaplicar filtros para respetar "solo pendientes" etc
        aplicarFiltros();
      });

      const link = document.createElement("a");
      link.href = "detalle.html?sin=" + encodeURIComponent(t.numeroSiniestro);
      link.textContent = "Ver caso";

      tdAcciones.appendChild(chk);
      tdAcciones.appendChild(link);

      tr.appendChild(tdSin);
      tr.appendChild(tdAseg);
      tr.appendChild(tdAnalista);
      tr.appendChild(tdTexto);
      tr.appendChild(tdFecha);
      tr.appendChild(tdEstado);
      tr.appendChild(tdAcciones);

      tbody.appendChild(tr);
    });

    const total = todasLasTareas.length;
    const visibles = tareasFiltradas.length;
    const pendientes = todasLasTareas.filter(x => !x.hecha).length;
    resumenEl.textContent =
      `Mostrando ${visibles} tarea(s). Pendientes: ${pendientes}. Total registradas: ${total}. Casos cargados: ${todosLosCasos.length}.`;
  }

  // Inicialización: por defecto solo pendientes y, si hay usuario, solo sus casos
  selectEstado.value = "pendientes";
  if (currentUser) chkSoloMias.checked = true;
  aplicarFiltros();
</script>

</body>
</html>
